[package]
name = "kerla_kernel"
version = "0.1.0"
authors = ["The Kerla Authors"]
edition = "2021"

[[bin]]
name = "kerla_kernel"
path = "main.rs"

[features]
# === KERN (immer da, nie gaten!) ===
# write, read, exit, exit_group, brk, mmap, arch_prctl, set_tid_address
# getpid, getppid, getcwd, getrandom

# === Neue Kategorien ===
filesystem = []     # open, close, stat, chmod, mkdir, unlink, etc.
process = []        # fork, execve, wait4
system = []         # prctl, reboot
paket = []          # Kern fuer Paketmanager: access uname nanosleep readlink poll sendto recvfrom kill clock_gettime

# === NETZWERK-SYSCALLS ===
socket = []           # socket, setsockopt (minimal für alle netzwerk-features)
connect = ["socket"]  # connect, send, recv (für q-downloads von server)
bind_listen = ["socket"]  # bind, listen, accept (für ssh/nc -l -e)

# === PROZESS-MANAGEMENT ===
signals = []          # signal, sigaction, kill
sessions = []         # setsid, setpgid, getpgid
credentials = []      # setuid, setgid, getuid, getgid (für ssh dropbear)

# === TIMING & EVENTS ===
timers = []           # clock_gettime, nanosleep
polling = []          # select, poll, epoll (für ssh keep-alive)

# === LEGACY FEATURE-FLAGS (aus komponenten) ===
default = ["paket", "socket", "connect", "bind_listen", "signals", "sessions", "filesystem", "process", "system"]
leitung = ["paket", "socket", "connect", "bind_listen", "signals", "sessions", "filesystem", "process", "system"]
ssh = ["paket", "leitung", "credentials", "timers", "polling"]
extra = ["paket"]            # bequemlichkeiten: access link linkat readlink fsync utimes uname syslog gettid

# === TEST-KONFIGURATIONEN ===
# Minimalistische Varianten für Minimalisierungs-Tests
q_only = ["socket", "connect", "filesystem", "process", "system"]
minimal_shell = ["signals", "sessions", "filesystem", "process", "system"]
q_and_shell = ["socket", "connect", "signals", "sessions", "filesystem", "process", "system"]
plug = []           # Kleinster Plugin-Satz: fstat mprotect rename access readlink clock_gettime sigaltstack getgid getegid
rest = ["plug"]     # Plugin: alles Gesperrte (nicht im Nano-Test benutzt); aus = Code fliegt raus
nano = []           # nur die 41 Syscalls aus dem Nano-Test (Whitelist)
kernel_only = []  # absolutes Minimum: nur Core-Syscalls

[dependencies]
log = { version = "0.4", features = ["release_max_level_off"] }
spin = "0.9.2"
goblin = { version = "0.5", default-features = false, features = ["elf64"] }
smoltcp = { version = "0.7.5", default-features = false, features = ["alloc", "proto-ipv4", "socket", "socket-raw", "socket-udp", "socket-tcp", "proto-dhcpv4", "ethernet"] }
boot2dump = { version = "0" }

# Data structues.
bitflags = "1.3.2"
arrayvec = { version = "0.7.2", default-features = false }
hashbrown = { version = "0.12.0", features = ["nightly"] }
crossbeam = { version = "0.8.1", default-features = false, features = ["alloc"] }
atomic_refcell = "0.1.6"
bitvec = { version = "1.0.0", default-features = false, features = ["atomic", "alloc"] }

# Arch-specific dependencies.
x86 = "0.47.0"

# Local dependencies.
kerla_runtime = { path = "../runtime" }
kerla_api = { path = "../libs/kerla_api" }
kerla_utils = { path = "../libs/kerla_utils", features = ["no_std"] }

# Kernel Extensions.
virtio_net = { path = "../exts/virtio_net" }
